{% extends "base.html" %}{% block title %}Reports — SpendAI{% endblock %}{% block content %}
<div class="topbar"><div><div class="badge">ANALYTICS</div><h1>Reports</h1><p>See where your money has gone over time.</p></div><a class="btn secondary" href="{{url_for('export_csv')}}">↓ Export CSV</a></div>
<div class="content-grid"><section class="card"><div class="card-head"><h2>Category spending</h2></div><canvas id="bar"></canvas></section><section class="card"><div class="card-head"><h2>Monthly spending</h2></div><canvas id="line"></canvas></section></div>
{% endblock %}{% block scripts %}<script>const cats={{cats|tojson}},months={{months|tojson}};new Chart(document.getElementById("bar"),{type:"bar",data:{labels:Object.keys(cats),datasets:[{label:"₹ spent",data:Object.values(cats)}]},options:{responsive:true}});new Chart(document.getElementById("line"),{type:"line",data:{labels:Object.keys(months),datasets:[{label:"₹ spent",data:Object.values(months),tension:.3}]},options:{responsive:true}});</script>{% endblock %}
